<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VASP Agent Demo</title>
  <style>
    :root { --bg:#0b0f14; --panel:#121822; --muted:#8696b0; --text:#e8eef7; --accent:#3aa0ff; --line:#1e2633 }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial; }
    header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--panel); display:flex; align-items:center; gap:12px }
    header h1 { margin:0; font-size:16px }
    main { display:flex; height:calc(100vh - 54px); }
    .col { flex:1; display:flex; flex-direction:column; min-width:0 }
    .left { border-right:1px solid var(--line) }
    .section-title { color:var(--muted); padding:8px 12px; border-bottom:1px solid var(--line) }
    .messages { flex:1; overflow:auto; padding:12px; display:flex; flex-direction:column; gap:8px }
    .msg { padding:10px 12px; border-radius:8px; max-width:80% }
    .msg.user { background:#1a2433; margin-left:auto }
    .msg.model { background:#101826; border:1px solid var(--line) }
    .input-bar { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); background:var(--panel) }
    .input-bar input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#0e1520; color:var(--text) }
    .input-bar button, .toolbar button { padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#0e1520; color:var(--text); cursor:pointer }
    .input-bar button:hover, .toolbar button:hover { border-color:var(--accent) }

    .toolbar { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel) }
    .files { flex:1; overflow:auto; padding:8px }
    .file-entry { padding:6px 8px; border-bottom:1px dashed var(--line); cursor:pointer }
    .file-entry:hover { background:#0f1622 }
    .preview { height:40%; border-top:1px solid var(--line); background:#0e1520 }
    .preview pre { margin:0; padding:12px; overflow:auto; white-space:pre-wrap; word-break:break-word }
    select { background:#0e1520; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px }
    small { color:var(--muted) }
  </style>
</head>
<body>
  <header>
    <h1>VASP Agent</h1>
    <small>对话 + 文件预览（Demo）</small>
  </header>
  <main>
    <section class="col left">
      <div class="section-title">对话</div>
      <div id="messages" class="messages"></div>
      <div class="input-bar">
        <input id="input" type="text" placeholder="输入消息，回车发送…" />
        <button id="send">发送</button>
      </div>
    </section>
    <section class="col right">
      <div class="toolbar">
        <button id="refresh">刷新目录</button>
        <label>calcdir: </label>
        <select id="calcdirs"></select>
      </div>
      <div id="files" class="files"></div>
      <div class="preview">
        <div class="section-title">预览</div>
        <pre id="preview"></pre>
      </div>
    </section>
  </main>

  <script>
    let session = null;

    const el = (sel) => document.querySelector(sel);
    const messagesEl = el('#messages');
    const inputEl = el('#input');
    const sendBtn = el('#send');
    const refreshBtn = el('#refresh');
    const calcdirsEl = el('#calcdirs');
    const filesEl = el('#files');
    const previewEl = el('#preview');

    function addMsg(role, text) {
      const node = document.createElement('div');
      node.className = `msg ${role}`;
      node.textContent = text;
      messagesEl.appendChild(node);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function createSession() {
      const res = await fetch('/api/session', { method: 'POST' });
      if (!res.ok) throw new Error('创建会话失败');
      session = await res.json();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || !session) return;
      addMsg('user', text);
      inputEl.value = '';

      try {
        const res = await fetch('/api/chat/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: session.session_id, text })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '发送失败');
        (data.messages || []).forEach(m => addMsg(m.role === 'model' ? 'model' : 'user', m.text));
      } catch (e) {
        addMsg('model', `错误：${e.message}`);
      }
    }

    async function loadCalcdirs() {
      const res = await fetch('/api/files/calcdirs');
      const data = await res.json();
      calcdirsEl.innerHTML = '';
      (data.calcdirs || []).forEach(name => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name; calcdirsEl.appendChild(opt);
      });
      if (calcdirsEl.value) loadFileList(); else filesEl.innerHTML = '<small>暂无目录</small>';
    }

    async function loadFileList() {
      const dir = calcdirsEl.value;
      if (!dir) return;
      const res = await fetch(`/api/files/list?path=${encodeURIComponent('tmp/' + dir)}`);
      const data = await res.json();
      filesEl.innerHTML = '';
      (data.entries || []).filter(e => e.type === 'file').forEach(e => {
        const div = document.createElement('div');
        div.className = 'file-entry';
        div.textContent = e.path;
        div.onclick = () => loadFileContent(e.path);
        filesEl.appendChild(div);
      });
      if (!filesEl.children.length) filesEl.innerHTML = '<small>该目录下没有文件</small>';
    }

    async function loadFileContent(path) {
      const res = await fetch(`/api/files/read?path=${encodeURIComponent(path)}`);
      const data = await res.json();
      previewEl.textContent = data.content || data.error || '无内容';
    }

    // Events
    sendBtn.onclick = sendMessage;
    inputEl.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
    refreshBtn.onclick = loadCalcdirs;
    calcdirsEl.onchange = loadFileList;

    // Init
    (async function init() {
      try {
        await createSession();
        await loadCalcdirs();
        addMsg('model', '你好，我是 VASP Agent。可以开始你的计算流程，比如发送 PDF 路径或化学式。');
      } catch (e) {
        addMsg('model', `初始化失败：${e.message}`);
      }
    })();
  </script>
</body>
</html>
